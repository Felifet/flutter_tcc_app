name: flutter_tcc_app
description: "Projeto do TCC. Desenvolvido em Flutter."
publish_to: 'none' # Remove this line if você quiser publicar no pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path: ^1.9.0
  path_provider: ^2.0.15
  sqflite: ^2.3.3+1
  intl: ^0.19.0
  excel: ^2.0.7
  file_picker: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Para adicionar assets ao seu aplicativo, adicione uma seção de assets assim:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
